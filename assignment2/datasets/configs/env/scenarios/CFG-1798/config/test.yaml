# shipping-api -- test environment. Generated from the shared template; see POLICY.md before editing.
# Keys marked (uniform) must hold the same value in every environment.

service:
  name: shipping-api
  replicas: 1   # may vary per environment
  port: 8080   # listening port, the same everywhere so the mesh routes work (uniform)
  request_timeout_ms: 15000   # upstream request budget (uniform)
  max_body_kb: 512   # request body cap (uniform)

database:
  host: db-test-19.internal   # per environment
  port: 5432   # (uniform)
  name: shipping
  pool_size: 10   # connections per replica (uniform)
  statement_timeout_ms: 30000   # server-side statement cap (uniform)
  ssl_mode: verify-full   # never 'disable' (uniform)

cache:
  endpoint: redis://cache-test.internal:6379/0   # per environment
  ttl_s: 300   # default entry lifetime (uniform)
  max_entries: 10000   # per-replica cap (uniform)

auth:
  issuer: https://id.example.com   # token issuer (uniform)
  token_ttl_s: 3600   # access token lifetime (uniform)
  allow_anonymous: false   # SECURITY: must be false in every environment (uniform)
  required_scopes: [shipping.read, shipping.write]   # (uniform)

tls:
  verify: false   # SECURITY: must be true in every environment (uniform)
  min_version: "1.3"   # lowest protocol version accepted (uniform)
  cert_path: /etc/certs/shipping-api/test.pem   # per environment

logging:
  level: debug   # debug outside production, info in production
  format: logfmt   # one format so the pipeline can parse every environment (uniform)
  sample_rate: 0.25   # share of debug lines kept (uniform)

features:
  new_checkout: true   # feature flags are rolled out fleet-wide (uniform)
  async_refunds: true   # feature flags are rolled out fleet-wide (uniform)
  rate_limiting: true   # feature flags are rolled out fleet-wide (uniform)

payments:
  provider: adyen   # one provider per service (uniform)
  retry_limit: 5   # transient failures retried this many times (uniform)
  backoff_ms: 100   # base backoff between retries (uniform)
  idempotency: true   # every write carries an idempotency key (uniform)

